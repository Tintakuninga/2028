<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autentifikasi</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --border-color: #e5e7eb;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        [data-theme="dark"] {
            --bg-color: #111827;
            --card-bg: #1f2937;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: #374151;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .auth-card { background-color: var(--card-bg); padding: 40px 30px; border-radius: 16px; box-shadow: var(--shadow); width: 100%; max-width: 380px; text-align: center; border: 1px solid var(--border-color); }
        .lock-icon { width: 50px; height: 50px; background: rgba(139, 92, 246, 0.1); color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
        h2 { font-size: 20px; margin-bottom: 8px; }
        p { font-size: 13.5px; color: var(--text-muted); margin-bottom: 24px; line-height: 1.5; }
        input { width: 100%; padding: 14px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 18px; background-color: var(--bg-color); color: var(--text-main); text-align: center; letter-spacing: 4px; font-weight: 700; margin-bottom: 16px; }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2); }
        button { width: 100%; background-color: var(--primary); color: white; padding: 14px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: var(--primary-hover); }
        .error-text { color: #ef4444; font-size: 13px; margin-top: 12px; display: none; font-weight: 500; }
        input {
            -webkit-text-security: disc;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="lock-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        </div>
        <h2>Insert Code</h2>
        <p>Masukkan kode akses untuk membuka aplikasi</p>
        
        <input type="text" id="codeInput" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="••••••" maxlength="6" oninput="this.value = this.value.replace(/\D/g, '')" onkeypress="if(event.key === 'Enter') verifyCode()">
        <button onclick="verifyCode()">Verifikasi Akses</button>
        
        <div id="errorText" class="error-text">Kode salah! Akses ditolak.</div>
    </div>

    <script>
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);

        function getMonthlyCode() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;            
            const rawCode = ((year * 13) + (month * 79) + 5432) % 1000000;
            return String(rawCode).padStart(6, '0');
        }

        function getCurrentMonthKey() {
            const now = new Date();
            return `${now.getFullYear()}-${now.getMonth() + 1}`;
        }

        const AUTH_API_URL = "https://script.google.com/macros/s/AKfycbxlx8AgyefD5dz4ZKWmHHPOS3MhY7ZKEdZgMrXZWUPsUKk1w2oVi9KBhN9SD5V3pLE/exec";
        const TARGET_PAGE = "index.html";

        const MAX_ATTEMPTS = 5;
        const LOCK_MINUTES = 5;

        async function verifyCode() {
            const inputEl = document.getElementById('codeInput');
            const errorEl = document.getElementById('errorMsg');
            const btnEl = document.querySelector('button');
            const code = inputEl.value.trim();

            const lockUntil = Number(localStorage.getItem('authLockUntil') || 0);
            if (Date.now() < lockUntil) {
                const sisaMenit = Math.ceil((lockUntil - Date.now()) / 60000);
                tampilkanError(errorEl, `Terlalu banyak percobaan. Coba lagi dalam ${sisaMenit} menit.`);
                return;
            }

            if (code.length < 6) {
                tampilkanError(errorEl, "Masukkan 6 digit kode akses.");
                return;
            }

            const teksAsli = btnEl.innerText;
            btnEl.disabled = true;
            btnEl.innerText = "Memverifikasi...";
            if (errorEl) errorEl.style.display = "none";

            try {
                const response = await fetch(AUTH_API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: "login", code: code })
                });

                const result = await response.json();

                if (result.valid) {
                    localStorage.removeItem('authFailCount');
                    localStorage.removeItem('authLockUntil');
                    localStorage.setItem('authMonth', result.monthKey);
                    localStorage.setItem('authToken', result.token);

                    window.location.replace(TARGET_PAGE);
                } else {
                    const fails = Number(localStorage.getItem('authFailCount') || 0) + 1;
                    localStorage.setItem('authFailCount', fails);

                    if (fails >= MAX_ATTEMPTS) {
                        localStorage.setItem('authLockUntil', Date.now() + (LOCK_MINUTES * 60 * 1000));
                        localStorage.setItem('authFailCount', 0);
                        tampilkanError(errorEl, `Salah ${MAX_ATTEMPTS}x. Akses dikunci selama ${LOCK_MINUTES} menit.`);
                    } else {
                        tampilkanError(errorEl, `${result.message} (Sisa percobaan: ${MAX_ATTEMPTS - fails})`);
                    }
                    inputEl.value = "";
                    inputEl.focus();
                }
            } catch (err) {
                tampilkanError(errorEl, "Gagal terhubung ke server. Pastikan koneksi internet aktif.");
            } finally {
                btnEl.disabled = false;
                btnEl.innerText = teksAsli;
            }
        }

        function tampilkanError(el, pesan) {
            if (!el) return;
            el.innerText = pesan;
            el.style.display = "block";
        }
    </script>
</body>
</html>
